<title>Noetic</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&family=Fira+Mono:wght@400;500&display=swap">
<style>
/* Layout: editor shell like VS Code/Unity — top bar (play controls) · left rail (workspaces) · project panel · main view · inspector · status bar. Panels collapse. */
:root{
  /* night forest: green-black neutrals, lichen accent, ember for danger, river blue for senses */
  --bg:#1F1F24;--panel:#1F1F24;--panel2:#2A2A2E;--raised:#2A2A2E;--hover:#36373B;--line:#36373B;--line2:#46474D;
  --fg:#D98A97;--mute:#B1B1B2;--dim:#838385;--faint:#414142;
  --moss:#206EC9;--moss-bg:#2A2A2E;--moss-line:#414142;--amber:#AB4051;--amber-bg:#AB4051;--sky:#7FA9DB;--sand:#AB4051;--gold:#AB4051;--rose:#AB4051;--ink:#206EC9;
  --sans:'Fira Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Fira Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --lw:270px;--rw:340px;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--sans);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--moss);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.s{width:15px;height:15px}
.num{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100%;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;min-height:50px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.brand small{font-weight:400;color:var(--dim);font-size:13px}
.playbar{display:flex;align-items:center;gap:6px;margin:0 auto;padding:4px;border-radius:9px;background:var(--bg);border:1px solid var(--line)}
.clock{display:inline-flex;align-items:center;gap:6px;padding:0 10px;font:500 15px var(--mono);font-variant-numeric:tabular-nums}
.top-r{display:flex;align-items:center;gap:6px}
.body{display:grid;grid-template-columns:72px var(--lw) minmax(0,1fr) var(--rw);min-height:0}
.body.noleft{--lw:0px}.body.noright{--rw:0px}
.rail{grid-column:1}.side{grid-column:2}.center{grid-column:3}.insp{grid-column:4}
#c-beh,#c-sim,#c-spe,#c-ind{grid-column:auto}
.body.noleft .side,.body.noright .insp{display:none}
.rail{display:flex;flex-direction:column;gap:4px;padding:8px 6px;border-right:1px solid var(--line);background:var(--panel)}
.rail button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 2px 7px;border:0;border-radius:8px;background:none;color:var(--dim);font-size:11px;line-height:1.1;position:relative}
.rail button:hover{background:var(--hover);color:var(--fg)}
.rail button[aria-current="page"]{color:var(--fg);background:var(--raised)}
.rail button[aria-current="page"]::before{content:"";position:absolute;left:-6px;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--moss)}
.rail .i{width:22px;height:22px}
.side,.insp{min-width:0;overflow:auto;background:var(--panel)}
.side{border-right:1px solid var(--line)}
.insp{border-left:1px solid var(--line)}
.ph{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:6px;height:40px;padding:0 8px 0 14px;background:var(--panel);border-bottom:1px solid var(--line);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.ph .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbody{padding:14px}
.center{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.ctool{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:50px;padding:7px 12px;border-bottom:1px solid var(--line);background:var(--panel2)}
.ctool .title{display:inline-flex;align-items:center;gap:8px;font-weight:600;margin-right:4px}
.ctool .sep{width:1px;height:24px;background:var(--line2)}
.cview{flex:1;min-height:0;position:relative}
.status{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;min-height:28px;padding:0 12px;border-top:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--dim)}
.status .grow{flex:1}
.status b{color:var(--mute);font-weight:500}
.kbd{display:inline-block;padding:0 5px;border:1px solid var(--line2);border-radius:4px;font:11px var(--mono);color:var(--mute)}
@media (max-width:900px){
  .app{height:auto}.body{grid-template-columns:minmax(0,1fr)}
  .rail,.side,.center,.insp{grid-column:1}
  .rail{flex-direction:row;border-right:0;border-bottom:1px solid var(--line)}.rail button{flex:1}
  .rail button[aria-current="page"]::before{left:10px;right:10px;top:auto;bottom:-6px;width:auto;height:3px}
  .side,.insp{border:0;border-top:1px solid var(--line);overflow:visible}
  .center{min-height:560px}.playbar{margin:0}
}

/* ---------- controls ---------- */
.btn{height:34px;padding:0 12px;border-radius:7px;border:1px solid var(--line2);background:var(--raised);display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--fg);text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--moss);border-color:var(--moss);color:var(--ink);font-weight:600}
.btn.pri:hover{background:#206EC9}
.btn.ghost{background:none;border-color:transparent;color:var(--mute)}
.btn.ghost:hover{background:var(--hover);color:var(--fg)}
.btn.on{border-color:var(--moss);color:var(--fg);background:var(--moss-bg)}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.btn.warn{border-color:#AB4051;color:#AB4051}
.ib{width:34px;height:34px;border-radius:7px;border:1px solid var(--line2);background:var(--raised);display:inline-flex;align-items:center;justify-content:center;padding:0;color:var(--fg);flex:none}
.ib:hover{background:var(--hover)}
.ib.on{border-color:var(--moss);color:var(--moss);background:var(--moss-bg)}
.ib.ghost{border-color:transparent;background:none;color:var(--mute)}
.ib.ghost:hover{background:var(--hover);color:var(--fg)}
.mini{width:26px;height:26px;border:0;border-radius:5px;background:none;color:var(--mute);display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none}
.mini:hover{background:var(--hover);color:var(--fg)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden;flex-wrap:wrap}
.seg button{height:32px;min-width:34px;padding:0 10px;border:0;background:var(--raised);color:var(--mute);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12px}
.seg button+button{border-left:1px solid var(--line2)}
.seg button:hover{color:var(--fg)}
.seg button.on{background:#46474D;color:var(--fg)}
select.inp,input.inp{width:100%;height:34px;border-radius:7px;border:1px solid var(--line2);background:var(--raised);padding:0 8px;font-size:13px}
select.inp.auto{width:auto}
.fld{display:block;font-size:12px;color:var(--mute);margin-bottom:6px}
.help{font-size:13px;color:var(--mute);line-height:1.55}
.help li{margin-bottom:7px}
.empty{color:var(--dim);font-size:13px;padding:28px;text-align:center}
.h{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:18px 0 8px}
.h:first-child{margin-top:0}
.h .grow{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 8px;border-radius:6px;background:#36373B;color:#B1B1B2;border:0}
button.chip:hover{background:#46474D}
.chip.on{background:var(--moss-bg);color:var(--fg);box-shadow:inset 0 0 0 1px var(--moss-line)}
.chip.amb{background:var(--amber-bg);color:#AB4051}
.bar{flex:1;height:6px;border-radius:3px;background:#36373B;overflow:hidden;display:block}
.bar>i{display:block;height:100%;border-radius:3px;background:#838385;transition:width .25s}
.bar>i.hi{background:var(--moss)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.arrow{color:var(--faint)}
.frow{display:grid;grid-template-columns:20px minmax(70px,auto) 1fr 64px;align-items:center;gap:10px;min-height:36px;font-size:13px}
.frow .fi{display:inline-flex}
.frow input[type=range]{width:100%;accent-color:var(--moss);min-width:0}
.frow output{text-align:right}

/* ---------- project panel ---------- */
.acc{border-bottom:1px solid var(--line)}
.acc-h{display:flex;align-items:center;gap:4px;height:34px;padding:0 6px 0 8px;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);cursor:pointer;user-select:none}
.acc-h:hover{color:var(--fg)}
.acc-h .t{flex:1}
.acc-h .acts{display:flex;gap:2px;opacity:.65}
.acc-h:hover .acts,.acc-h:focus-within .acts{opacity:1}
.acc-b{padding:0 8px 10px}
.hintline{font-size:11.5px;color:var(--dim);padding:0 6px 6px}
.row{display:flex;align-items:center;gap:8px;min-height:30px;padding:0 6px;border-radius:5px;font-size:13px;color:#B1B1B2;cursor:pointer;user-select:none}
.row:hover{background:var(--hover)}
.row.sel{background:#36373B;color:var(--fg);box-shadow:inset 0 0 0 1px var(--moss-line)}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .more{opacity:0}
.row:hover .more,.row:focus-within .more,.row.sel .more{opacity:1}
.row .meta{font-size:11px;color:var(--dim);white-space:nowrap}
.row[draggable="true"]{cursor:grab}
.kids{margin-left:12px;padding-left:6px;border-left:1px solid var(--line)}
.kids:empty::after{content:"empty";display:block;font-size:11px;color:var(--faint);padding:4px 6px}
.cnt{font:11px var(--mono);color:var(--dim)}
.ren{flex:1;min-width:0;height:24px;border:1px solid var(--moss);background:var(--bg);border-radius:4px;padding:0 6px;font-size:13px}

/* ---------- inspector ---------- */
.need{display:grid;grid-template-columns:20px 1fr 28px;align-items:center;gap:10px;height:26px}
.kv{display:grid;grid-template-columns:20px 1fr;gap:8px 10px;align-items:center;font-size:13px}
.log{display:grid;grid-template-columns:44px 16px 1fr;gap:8px;align-items:center;font-size:12px;min-height:22px}
.doing{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;background:var(--moss-bg);border:1px solid #414142;margin-top:12px}
.doing.react{background:var(--amber-bg);border-color:#AB4051}
.doing b{font-size:14px}
.doing small{display:block;color:var(--mute);font-size:12px}
.ptitle{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.ptitle input{flex:1;min-width:0;height:34px;border:1px solid transparent;border-radius:6px;background:none;font-size:16px;font-weight:600;padding:0 6px}
.ptitle input:hover,.ptitle input:focus{border-color:var(--line2);background:var(--raised)}
.legend{display:grid;grid-template-columns:22px 1fr;gap:8px 10px;align-items:center;font-size:13px;color:var(--mute)}
.sw{display:inline-block;width:18px;height:12px;border-radius:3px}
.testgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.testgrid .btn{justify-content:flex-start}

/* ---------- graph ---------- */
.gcanvas{position:absolute;inset:0;overflow:hidden;cursor:grab;background-color:var(--bg);background-image:radial-gradient(#36373B 1px,transparent 1px);background-size:24px 24px;touch-action:none}
.gcanvas.panning{cursor:grabbing}
.gworld{position:absolute;left:0;top:0;transform-origin:0 0}
.gsvg{position:absolute;overflow:visible;pointer-events:none}
.gsvg path.e{fill:none;stroke:#838385;stroke-width:2}
.gsvg path.e.amb{stroke:#AB4051}
.gsvg path.e.on{stroke:var(--moss);stroke-width:3}
.gsvg path.e.sel{stroke:var(--fg);stroke-width:3}
.gsvg path.hit{fill:none;stroke:transparent;stroke-width:14;pointer-events:stroke;cursor:pointer}
.gsvg path.tmp{fill:none;stroke:var(--moss);stroke-width:2;stroke-dasharray:6 5}
.gn{position:absolute;border-radius:10px;background:#2A2A2E;border:1px solid #414142;color:var(--fg);font-size:13px;cursor:move;user-select:none;box-shadow:0 4px 14px rgba(31,31,36,.28)}
.gn:hover{border-color:#838385}
.gn.sel{border-color:var(--fg);box-shadow:0 0 0 3px rgba(177,177,178,.14)}
.gn.loose{opacity:.55;border-style:dashed}
.gn.live{border-color:var(--moss);box-shadow:0 0 0 3px rgba(32,110,201,.3)}
.gn.amb{background:#2A2A2E;border-color:#AB4051}
.gn.mos{background:#2A2A2E;border-color:#414142}
.gn .hd{display:flex;align-items:center;gap:8px;padding:9px 12px 0;font-weight:600}
.gn .sub{padding:2px 12px 0;font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.port{position:absolute;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:#2A2A2E;border:2px solid #838385;cursor:crosshair;z-index:2}
.port.in{left:-9px}.port.out{right:-9px}
.port:hover,.port.hot{border-color:var(--moss);background:var(--moss);transform:scale(1.15)}
.gn .open{position:absolute;right:6px;top:6px}
.tagl{position:absolute;right:8px;bottom:6px;font:10px var(--mono);color:var(--amber)}

/* ---------- world ---------- */
.wbox{position:absolute;inset:0;background:#2A2A2E}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#cv.sel{cursor:default}
.hud{position:absolute;right:10px;top:10px;display:flex;gap:10px;align-items:center;padding:6px 10px;border-radius:8px;background:rgba(31,31,36,.85);font-size:12px}
.hud button{border:0;background:none;padding:0;display:inline-flex;align-items:center;gap:6px;color:var(--fg)}
.hint{position:absolute;left:10px;top:10px;padding:6px 12px;border-radius:8px;background:rgba(31,31,36,.85);font-size:12px;color:var(--mute);white-space:nowrap;max-width:calc(100% - 240px);overflow:hidden;text-overflow:ellipsis}
.mm{position:absolute;left:10px;bottom:10px;border-radius:8px;overflow:hidden;border:1px solid #414142;background:#2A2A2E;box-shadow:0 6px 20px rgba(31,31,36,.4)}
.mm canvas{display:block;cursor:pointer}
.zoomc{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:4px}
.zoomc .ib{background:rgba(42,42,46,.92)}
.daystrip{padding:8px 12px 10px;border-top:1px solid var(--line);background:var(--panel2)}
.strip{display:grid;grid-template-columns:64px minmax(0,1fr);gap:4px 10px;align-items:center}
.sky{position:relative;height:20px;border-radius:4px;cursor:pointer;background:linear-gradient(90deg,#161B33 0%,#1D2444 18%,#C98B5A 25%,#8FB2CF 33%,#9DC0DB 50%,#8FB2CF 70%,#D9895B 76%,#4A2F55 82%,#1D2444 88%,#161B33 100%)}
.sky .now{position:absolute;top:-4px;width:2px;height:28px;background:#fff;border-radius:1px;margin-left:-1px;pointer-events:none}
.lane{position:relative;height:10px;border-radius:3px;background:#2A2A2E}
.lane>i{position:absolute;top:0;height:10px;border-radius:3px}
.lanelbl{font-size:11px;color:var(--mute);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ticks{display:flex;justify-content:space-between;color:var(--dim)}

/* ---------- forms / cards ---------- */
.scroll{position:absolute;inset:0;overflow:auto}
.wrapc{padding:20px;display:flex;flex-direction:column;gap:16px;max-width:1200px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:16px;align-items:start}
.cards.grp{grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));align-items:stretch}
.cards.grp>section[data-grp]{display:none}
.cards.grp[data-show="corpo"]>section[data-grp="corpo"],.cards.grp[data-show="mente"]>section[data-grp="mente"],.cards.grp[data-show="terr"]>section[data-grp="terr"],.cards.grp[data-show="modelo"]>section[data-grp="modelo"]{display:block}
.cards[data-show="modelo"]{grid-template-columns:minmax(0,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.ct{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin:0 0 4px}
.ct .grow{flex:1}
.cd{font-size:12.5px;color:var(--dim);margin:0 0 12px}
.bigname{font-size:22px;font-weight:600;border:1px solid transparent;border-radius:6px;background:none;padding:0 6px;height:38px;min-width:0;width:12ch}
.bigname:hover,.bigname:focus{border-color:var(--line2);background:var(--raised)}
.swatch{width:28px;height:28px;border-radius:50%;border:2px solid transparent;padding:0}
.swatch.on{border-color:var(--fg)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td{padding:6px 0;border-bottom:1px solid #2A2A2E}
.tbl input{width:100%;height:30px;border:1px solid var(--line2);border-radius:5px;background:var(--raised);padding:0 8px;font:12px var(--mono)}
.trow{display:grid;grid-template-columns:20px 90px 1fr 40px;align-items:center;gap:10px;min-height:34px;font-size:13px}
.trow input{width:100%;min-width:0}
.radar{position:relative;width:260px;height:260px;flex:none;max-width:100%}
.radar .ax{position:absolute;display:inline-flex}
.cmp{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px 14px;align-items:center;font-size:13px}
.stp{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:6px;background:#36373B}

/* ---------- overlays ---------- */
#tip{position:fixed;z-index:60;max-width:300px;padding:11px 13px;border-radius:8px;background:#2A2A2E;border:1px solid #414142;box-shadow:0 12px 30px rgba(31,31,36,.45);pointer-events:none;font-size:12px;line-height:1.5;color:#B1B1B2}
#tip .t{display:block;color:var(--fg);font-size:13px;font-weight:600;margin-bottom:3px}
#tip .m{margin-top:6px}
#tip .m b{color:var(--moss)}
#tip .a{margin-top:6px;font-size:11px;color:var(--dim)}
#menu{position:fixed;z-index:55;min-width:220px;padding:6px;border-radius:8px;background:#2A2A2E;border:1px solid #414142;box-shadow:0 12px 30px rgba(31,31,36,.5)}
#menu button{width:100%;display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border:0;border-radius:5px;background:none;color:var(--fg);font-size:13px;text-align:left}
#menu button:hover,#menu button:focus{background:#36373B}
#menu button.danger{color:var(--rose)}
#menu .k2{margin-left:auto;font:11px var(--mono);color:var(--dim)}
#menu hr{border:0;height:1px;background:#414142;margin:6px 2px}
#menu .lbl{font-size:11px;color:var(--dim);padding:4px 8px}
#toast{position:fixed;z-index:70;left:50%;bottom:calc(40px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:8px;background:#2A2A2E;border:1px solid #414142;box-shadow:0 12px 30px rgba(31,31,36,.45);font-size:13px;max-width:calc(100vw - 32px)}
#toast button{border:0;background:none;color:var(--moss);font-weight:600;padding:4px}
#modal{position:fixed;inset:0;z-index:65;background:rgba(31,31,36,.7);display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.dlg{width:100%;max-width:720px;border-radius:14px;background:var(--panel);border:1px solid #36373B;box-shadow:0 24px 60px rgba(31,31,36,.5)}
.dlg-h{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.dlg-h h2{margin:0;font-size:17px}
.dlg-b{padding:4px 20px 20px}
.dlg-f{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line)}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}

function driveVal(a,sp,need){const N=a.needs;switch(need){
 case'hunger':return N.hunger;case'thirst':return N.thirst;case'tired':return N.tired+(inRanges(S.hour,activeR(sp))?0:55)+(limping(a)?35:0);
 case'fear':return 25+N.fear*.8+(a.quirks.includes('keeps watch more than others')?20:0);case'calm':return(100-N.fear)*.55;
 case'curiosity':return 20+a.tr.curiosity*.6;case'bored':return 30+a.tr.energy*.2+(a.quirks.includes('digs when bored')?20:0);
 case'markUrge':return sp.marks.on&&sp.marks.types.length?clamp((S.gameH-a.lastMark)/(sp.marks.freq/60)*100,0,100):0;
 case'aggro':{const r=nearestRival(a,25);if(!r)return 0;const since=clamp((S.gameH-(a.lastFight??-10))/2,0,1);return clamp((a.tr.aggro??30)*1.15*since*(r.d<10?1:.7),0,100)}
 case'heat':return N.heat;case'song':return N.song;case'safety':return 100-N.safety}return 30}
function nearestRival(a,max){let best=null,bd=max;for(const o of AG){if(o===a||o.sp!==a.sp||o.hidden||o.dead||o.mode==='react')continue;const d=Math.hypot(o.x-a.x,o.y-a.y);if(d<bd){bd=d;best=o}}return best?{o:best,d:bd}:null}

 if(r.act==='fight'&&r.rival===a)return;
 const back=(r.tr.aggro??30)*.6+(r.tr.stubborn??30)*.4+rnd(-15,15)>(a.tr.aggro??30)*.8;
 const Hm=HP(sp).max,dmg=k=>Hm*(.05+Math.random()*.07)*(.6+k/125);
 if(back){hurt(r,dmg(a.tr.aggro??30),'fight with '+a.name);hurt(a,dmg(r.tr.aggro??30),'fight with '+r.name);if(r.dead||a.dead)return;r.act='fight';r.stepI=1;r.stepT=0;r.tgt=null;r.rival=a;r.needs.tired=clamp(r.needs.tired+8,0,100);log(a,'charge','fought '+r.name);log(r,'charge','fought back against '+a.name)}

 const sky=t.closest('#sky');if(sky){const r=sky.getBoundingClientRect();S.hour=clamp((e.clientX-r.left)/r.width,0,.999)*24;renderDayStrip();return}
 const ts=t.closest('[data-test]');if(ts){const a=selAgent();if(!a)return;const k=ts.dataset.test;
  if(['thirst','hunger','tired'].includes(k)){a.needs[k]=95;a.act=null;toast(`${a.name}: ${NEEDS[k].n.toLowerCase()} at 95`)}
  if(k==='noise'){const ang=rnd(0,6.28);NOISES.push({x:clamp(a.x+Math.cos(ang)*8,1,W.w-1),y:clamp(a.y+Math.sin(ang)*8,1,W.h-1),p:1.6,t:0})}
  if(k==='scare'){a.needs.fear=100;a.threat={x:PLAYER.x,y:PLAYER.y,name:'player'};a.alarm={...a.threat,until:S.gameH+.06}}
  if(k==='hurt'){hurt(a,HP(SPECIES[a.sp]).max*.3,'test');renderDbgHead()}
  if(k==='heal'){a.hp=HP(SPECIES[a.sp]).max;a.dead=false;a.anim='idle';renderDbgHead()}
  if(k==='calm'){a.needs.fear=0;if(a.mode==='react'){a.mode='normal';a.react=null;a.hidden=false}}return}
 const st=t.closest('[data-set]');if(st){const sp=SPECIES[S.sp];let v=st.dataset.val;if(st.dataset.set==='group'&&v==='herd'&&sp.diet==='omni')v='band';sp[st.dataset.set]=v;if(st.dataset.set==='kind'){if(sp.kind==='bird'){sp.gait='flutter';sp.shelter='tree'}else if(sp.gait==='flutter')sp.gait='walk'}if(st.dataset.set==='group')sp.grpSize=v==='solo'?1:v==='flock'?8:4;if(st.dataset.set==='shelter'){const list=AG.filter(x=>x.sp===S.sp);list.forEach((a,k)=>a.home=homeFor(S.sp,k,a.grp))}renderSpe();return}
 const sw=t.closest('[data-color]');if(sw){SPECIES[S.sp].color=sw.dataset.color;renderSpe();renderSide();return}
 const mt=t.closest('[data-mtype]');if(mt){const m=SPECIES[S.sp].marks,k=mt.dataset.mtype;m.types=m.types.includes(k)?m.types.filter(x=>x!==k):[...m.types,k];renderSpe();return}
 const mm2=t.closest('[data-mmean]');if(mm2){const m=SPECIES[S.sp].marks;m[mm2.dataset.mmean]=!m[mm2.dataset.mmean];renderSpe();return}
 const rq=t.closest('[data-rmquirk]');if(rq){const a=selAgent();a.quirks.splice(+rq.dataset.rmquirk,1);renderInd();return}
 const tp=t.closest('[data-tpl]');if(tp){NEW.name=$('#nsName').value;NEW.tpl=tp.dataset.tpl;if(SPECIES[NEW.tpl]){NEW.sched=SPECIES[NEW.tpl].sched;NEW.group=SPECIES[NEW.tpl].group==='band'?'herd':SPECIES[NEW.tpl].group;NEW.kind=SPECIES[NEW.tpl].kind}renderNewSp();return}
 const nw=t.closest('[data-new]');if(nw){NEW.name=$('#nsName').value;NEW[nw.dataset.new]=nw.dataset.val;renderNewSp();return}
 const nc=t.closest('[data-newcolor]');if(nc){NEW.name=$('#nsName').value;NEW.color=nc.dataset.newcolor;renderNewSp();return}
 if(t===$('#modal')){$('#modal').hidden=true;return}
 const act=t.closest('[data-act]');if(!act)return;const A=act.dataset.act,sp=SPECIES[S.sp];
 switch(A){
  case'play':S.playing=!S.playing;renderPlaybar();renderStatus();break;
  case'stepOnce':S.playing=false;stepSim(.1);renderPlaybar();renderStatus();if(S.tab==='sim'||S.tab==='ind')renderDbgLive();break;
  case'toggleLeft':S.left=!S.left;applyPanels();break;case'toggleRight':S.right=!S.right;applyPanels();break;
  case'help':openHelp();break;case'export':openExport();break;
  case'remote':openRemote();break;
  case'spawnFollow':if(sp){spawn(S.sp,1);const n=AG[AG.length-1];S.sel=n.id;renderGraph();renderSide();renderStatus();toast(`${n.name} spawned in the world; following in the brain`)}break;
  case'editWorld':S.edit=!S.edit;S.brush='move';S.wsel=null;renderSimTool();renderInsp();break;
  case'terrDel':if(S.wsel){removeTerrain(S.wsel);S.wsel=null;renderEditInsp()}break;
  case'worldReset':{const old=structuredClone(W);for(const k of Object.keys(W0))W[k]=structuredClone(W0[k]);rehome();S.wsel=null;terrainChanged();renderEditInsp();toast('World restored',()=>{for(const k of Object.keys(old))W[k]=old[k];rehome();terrainChanged();renderEditInsp()});break}
  case'worldClear':{const old={};for(const k of['trees','bushes','rocks','burrows','ponds','muds','grass','clover','river','forest'])old[k]=W[k];for(const k of['trees','bushes','rocks','burrows','ponds','muds','grass','clover','river'])W[k]=[];W.forest={x:0,y:0,rx:0,ry:0};rehome();S.wsel=null;terrainChanged();renderEditInsp();toast('Terrain cleared',()=>{Object.assign(W,old);rehome();terrainChanged();renderEditInsp()});break}
  case'tryConnect':{REMOTE.addr=$('#rAddr').value.trim()||REMOTE.addr;REMOTE.state='searching';openRemote();setTimeout(()=>{REMOTE.state='fail';if(!$('#modal').hidden&&$('#rAddr'))openRemote();renderTopR()},1600);break}
  case'doImport':doImport();break;
  case'newSpecies':openNewSpecies();break;case'newAct':newAct();break;case'newFolder':newFolder(act.dataset.kind);break;
  case'importRon':openImport();break;
  case'testSim':case'follow':{const a=selAgent();setWS('sim');if(a)focusAgent(a);break}
  case'goSpe':setWS('spe');break;case'goInd':setWS('ind');break;case'goBeh':S.gview='sp';S.gsel=null;setWS('beh');break;
  case'locate':{const a=selAgent();if(S.tab!=='sim')setWS('sim');focusAgent(a);break}
  case'deselect':selectAgent(null);break;
  case'layers':{const r=act.getBoundingClientRect();layersMenu(r.left,r.bottom+4);e.stopPropagation();break}
  case'spawn':{const id=$('#spawnSp').value;const n0=AG.length;spawn(id,1);const a=AG[n0];a.x=clamp(CAM.cx+rnd(-3,3),2,W.w-2);a.y=clamp(CAM.cy+rnd(-3,3),2,W.h-2);selectAgent(a.id);renderSide();toast(`${a.name} spawned`);break}
  case'spawnOne':if(sp){spawn(S.sp,1);const a=AG[AG.length-1];toast(`${a.name} spawned`);renderSide();renderStatus();if(S.tab==='spe')renderSpe();if(S.tab==='ind'){S.sel=a.id;renderInd();renderInsp()}}break;
  case'dupSp':dup('sp',S.sp);break;case'delSp':delItem('sp',S.sp);break;
  case'marksOn':sp.marks.on=!sp.marks.on;renderSpe();break;
  case'addQuirk':{const v=$('#addQuirk').value;if(v){selAgent().quirks.push(v);renderInd()}break}
  case'reroll':{const a=selAgent();if(!a||a.lock)break;a.seed=Math.floor(Math.random()*99999)+1;a.tr=rollTraits(SPECIES[a.sp],a.seed);a.quirks=pickQuirks(SPECIES[a.sp],a.seed);renderInd();renderInsp();break}
  case'lock':{const a=selAgent();a.lock=!a.lock;renderInd();break}
  case'wind':S.wind.a+=Math.PI/4;renderHud();break;
  case'wzin':zoomAt(1.3,VIEW.w/2,VIEW.h/2);break;case'wzout':zoomAt(1/1.3,VIEW.w/2,VIEW.h/2);break;case'wfit':CAM.z=1;clampCam();break;
  case'gback':{const id=S.gview;S.gview='sp';const n=SPECIES[S.sp].g.nodes.find(n=>n.type==='act'&&n.a===id);S.gsel=n?{kind:'node',id:n.id}:null;renderSide();renderGraph();renderProps();break}
  case'zin':zoomBy(1.2);break;case'zout':zoomBy(1/1.2);break;case'zfit':fitGraph();break;
  case'delNode':if(S.gsel?.kind==='node')deleteNode(S.gsel.id);break;
  case'delEdge':if(S.gsel?.kind==='edge'){curGraph().edges.splice(S.gsel.id,1);S.gsel=null;afterEdit(true)}break;
  case'addToSp':addBlock('act:'+S.selAct);break;
  case'savePreset':{const mode=act.dataset.pmode,inp=$('#presetName-'+mode),name=(inp.value||'').trim();if(!name){inp.focus();toast('Give the preset a name');break}
   let t;if(mode==='sp')t=structuredClone(sp.traits);else{const a=selAgent();if(!a)break;t=Object.fromEntries(Object.entries(a.tr).map(([k,v])=>[k,[v,15]]))}
   PRESETS.push({id:'u'+Date.now(),name,ic:'star',t});if(mode==='sp')renderSpe();else renderInd();toast(`Preset ${name} saved`);break}
  case'rerollAll':{let n=0;for(const a of AG)if(a.sp===S.sp&&!a.lock){a.seed=Math.floor(Math.random()*99999)+1;a.tr=rollTraits(sp,a.seed);n++}toast(`${n} ${sp.name.toLowerCase()}${n===1?'':'s'} with a new personality`);renderInsp();break}
  case'animSheet':openAnimSheet();break;
  case'copySheet':{const ta=$('#sheetTxt');if(navigator.clipboard)navigator.clipboard.writeText(ta.value).then(()=>toast('List copied')).catch(()=>{ta.focus();ta.select();toast('Text selected: use Ctrl+C')});else{ta.focus();ta.select()}break}
  case'closeModal':$('#modal').hidden=true;break;case'createSpecies':createSpecies();break;
  case'copyRon':{const ta=$('#ronTxt');if(navigator.clipboard)navigator.clipboard.writeText(ta.value).then(()=>toast('Copied')).catch(()=>{ta.focus();ta.select();toast('Text selected: use Ctrl+C')});else{ta.focus();ta.select()}break}
 }});
document.addEventListener('contextmenu',e=>{const n=e.target.closest('[data-node]');if(!n)return;e.preventDefault();nodeMenu(n.dataset.node,e.clientX,e.clientY)});
document.addEventListener('dragstart',e=>{const p=e.target.closest?.('[data-pal]');if(!p)return;e.dataTransfer.setData('text/plain',p.dataset.pal);e.dataTransfer.effectAllowed='copy';TIP.hidden=true});
document.addEventListener('dblclick',e=>{const p=e.target.closest('[data-pal]');if(p&&S.tab==='beh'){const [ty,ref]=p.dataset.pal.split(':');if(ty==='act'&&S.gview!=='sp'){openAct(ref);return}addBlock(p.dataset.pal);return}
 const nd=e.target.closest('[data-node]');if(nd&&S.tab==='beh'){const [k,ty,id]=nd.dataset.node.split(':');if(k==='act'&&ty==='item')openAct(id)}});
document.addEventListener('input',e=>{const t=e.target,sp=SPECIES[S.sp];
 if(t.dataset.bind&&sp){const v=t.type==='range'||t.type==='number'?parseFloat(t.value):t.value;setP(sp,t.dataset.bind,v);const o=t.parentElement.querySelector('output');if(o)o.textContent=fmtU(v,t.dataset.u);
  if(t.dataset.bind==='threshold'){const n=document.querySelector('[data-thr]');if(n)n.textContent=v}
  if(t.dataset.bind==='noise'){const n=document.querySelector('[data-noise]');if(n)n.textContent=Math.round(v*100)}return}
 if(t.id==='actW'){ACTS[S.selAct].weight=parseFloat(t.value);t.nextElementSibling.textContent=parseFloat(t.value).toFixed(2);return}
 if(t.id==='actName'){ACTS[S.selAct].name=t.value;return}
 if(t.id==='spName'&&sp){sp.name=t.value;return}
 if(t.id==='agName'){const a=selAgent();if(a)a.name=t.value;return}
 if(t.dataset.trait){const a=selAgent();a.tr[t.dataset.trait]=+t.value;t.nextElementSibling.textContent=t.value;return}
 if(t.dataset.traitBase&&sp){sp.traits[t.dataset.traitBase][0]=+t.value;return}
 if(t.dataset.traitVar&&sp){sp.traits[t.dataset.traitVar][1]=clamp(+t.value||0,0,50);return}
 if(t.dataset.anim&&sp){sp.anim=sp.anim||{};sp.anim[t.dataset.anim]=t.value;return}
 if(t.id==='spColor'&&sp){sp.color=t.value;return}
 if(t.id==='nsColor'){NEW.color=t.value;return}
 if(t.dataset.bw!=null){setBranchPct(+t.dataset.bw,+t.value);return}
 if(t.dataset.bwn!=null){if(t.value!=='')setBranchPct(+t.dataset.bwn,+t.value);return}
 if(t.dataset.terr&&S.wsel?.obj){const v=parseFloat(t.value);S.wsel.obj[t.dataset.terr]=v;t.nextElementSibling.textContent=fmtU(v,'m');terrainChanged();return}
 if(t.id==='pondName'&&S.wsel?.obj){S.wsel.obj.name=t.value;return}});
document.addEventListener('change',e=>{const t=e.target;const gn=()=>curGraph()?.nodes.find(n=>n.id===S.gsel?.id);
 if(t.id==='actNeed'){ACTS[S.selAct].need=t.value;renderGraph();renderProps()}
 if(t.id==='actCurve'){ACTS[S.selAct].curve=t.value;renderGraph();renderProps()}
 if(t.id==='reactType'){const n=gn();if(n){n.r=t.value;afterEdit(true)}}
 if(t.id==='stepType'){const n=gn();if(n){n.s=t.value;delete n.t;delete n.anim;afterEdit(true)}}
 if(t.id==='stepT0'||t.id==='stepT1'){const n=gn();if(n){const a=Math.max(.1,parseFloat($('#stepT0').value)||.1),b=Math.max(a,parseFloat($('#stepT1').value)||a);n.t=[a,b];afterEdit(true)}}
 if(t.id==='stepAnim'){const n=gn();if(n){n.anim=t.value.trim();afterEdit(true)}}
 if(t.id==='gFollow'){selectAgent(t.value?+t.value:null)}
 if(t.id==='actName'||t.id==='spName'||t.id==='agName'){renderSide();renderStatus();if(S.tab==='beh')renderGraph()}
 if(t.id==='dayLen'){S.dayLen=+t.value;renderStatus()}
 if(t.id==='spawnSp')S.sp=t.value;
 if(t.id==='forget')S.forget=t.checked;
 if(t.id==='dropSp')S.dropSp=t.value;
 if(t.id==='spColor'){renderSpe();renderSide();mmBase=null}
 if(t.id==='nsColor'){NEW.name=$('#nsName').value;renderNewSp()}
 if(t.dataset.stim){const k=t.dataset.stim;STIMS[k]=t.type==='range'?+t.value:t.value;renderInd()}
 if(t.dataset.traitBase||t.dataset.traitVar){if(S.tab==='spe')renderSpe()}
 if(t.dataset.trait&&S.tab==='ind'){renderInd();renderInsp()}});
document.addEventListener('keydown',e=>{const t=e.target;
 if(t.classList?.contains('ren')){if(e.key==='Enter')commitRename(t);if(e.key==='Escape'){S.renaming=null;renderSide()}return}
 if((e.ctrlKey||e.metaKey)&&(e.key==='b'||e.key==='B')){e.preventDefault();S.left=!S.left;applyPanels();return}
 if((e.ctrlKey||e.metaKey)&&(e.key==='i'||e.key==='I')){e.preventDefault();S.right=!S.right;applyPanels();return}
 if(e.key==='Escape'){closeMenu();$('#modal').hidden=true;return}
 const typing=['INPUT','SELECT','TEXTAREA'].includes(t.tagName);
 const n=t.closest?.('[data-node]');
 if(n&&!typing){if(e.key==='Enter'||e.key===' '){e.preventDefault();n.click()}if(e.key==='F2'){e.preventDefault();startRename(n.dataset.node)}if(e.key==='Delete'){const [k,ty,id]=n.dataset.node.split(':');ty==='folder'?delFolder(k,id):delItem(k,id)}return}
 const ah=t.closest?.('[data-acc]');if(ah&&(e.key==='Enter'||e.key===' ')){e.preventDefault();ah.click();return}
 if(S.tab==='beh'&&!typing&&(e.key==='Delete'||e.key==='Backspace')&&S.gsel){e.preventDefault();if(S.gsel.kind==='node')deleteNode(S.gsel.id);else if(S.gsel.kind==='edge'){curGraph().edges.splice(S.gsel.id,1);S.gsel=null;afterEdit(true)}return}
 if(e.key===' '&&!typing&&t.tagName!=='BUTTON'){e.preventDefault();S.playing=!S.playing;renderPlaybar();renderStatus()}});
document.addEventListener('focusout',e=>{if(e.target.classList?.contains('ren'))setTimeout(()=>{if(document.body.contains(e.target))commitRename(e.target)},0)});

/* tooltip */
const TIP=$('#tip');let tipEl=null,tipTimer;
function showTip(el){const raw=el.dataset.tip;if(!raw)return;const [t,d,m,a]=raw.split('|');
 TIP.innerHTML=`<span class="t">${esc(t)}</span>${d?`<div>${esc(d)}</div>`:''}${m?`<div class="m"><b>Changes:</b> ${esc(m)}</div>`:''}${a?`<div class="a">${esc(a)}</div>`:''}`;TIP.hidden=false;
 const r=el.getBoundingClientRect(),tr=TIP.getBoundingClientRect();let x=r.left+r.width/2-tr.width/2,y=r.bottom+8;if(y+tr.height>innerHeight-8)y=r.top-tr.height-8;
 TIP.style.left=clamp(x,8,innerWidth-tr.width-8)+'px';TIP.style.top=Math.max(8,y)+'px'}
document.addEventListener('mouseover',e=>{const el=e.target.closest('[data-tip]');if(el===tipEl)return;tipEl=el;clearTimeout(tipTimer);TIP.hidden=true;if(el)tipTimer=setTimeout(()=>{if(tipEl===el&&!GD&&!drag&&document.body.contains(el))showTip(el)},380)});
document.addEventListener('focusin',e=>{const el=e.target.closest('[data-tip]');if(el&&e.target.matches(':focus-visible')){tipEl=el;showTip(el)}});
document.addEventListener('focusout',()=>{TIP.hidden=true});
document.addEventListener('pointerdown',()=>{clearTimeout(tipTimer);TIP.hidden=true});
document.addEventListener('scroll',()=>{TIP.hidden=true},true);

/* ============ loop ============ */
let last=performance.now(),uiT=0,mmT=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 if(S.playing){let rem=dt*S.speed;while(rem>0){const d=Math.min(.1,rem);stepSim(d);rem-=d}}
 draw();
 if(now-uiT>230){uiT=now;const ct=$('#clockT');if(ct)ct.textContent=hhmm(S.hour);
  if(S.tab==='sim'||S.tab==='ind')renderDbgLive();
  if(S.tab==='sim'){const m=$('#nowMark');if(m)m.style.left=(S.hour/24*100)+'%';const lp=$('#lightPct');if(lp)lp.textContent=Math.round(lightAt(S.hour)*100)+'%';
   document.querySelectorAll('[data-arow]').forEach(el=>{const a=AG.find(x=>x.id===+el.dataset.arow);if(a)el.textContent=actLabel(a)})}
  if(S.tab==='beh'){for(const a of AG){const sp=SPECIES[a.sp];if(sp&&a.sp===S.sp)a.scores=scoreAll(a,sp)}liveGraph()}
  if(!TIP.hidden&&tipEl&&!document.body.contains(tipEl))TIP.hidden=true}
 if(S.tab==='sim'&&now-mmT>120){mmT=now;drawMinimap()}
 requestAnimationFrame(frame)}

/* ============ boot ============ */
for(const k in ACTS)buildActGraph(ACTS[k]);for(const k in SPECIES)buildSpGraph(SPECIES[k]);
for(const id of spIds())spawn(id,SPECIES[id].count);
S.sel=AG.find(a=>a.sp==='coelho')?.id||null;
setupGraphEvents();renderPlaybar();renderTopR();applyPanels();setWS(S.tab);
for(let i=0;i<30;i++)stepSim(.1);
requestAnimationFrame(frame);

</script>
